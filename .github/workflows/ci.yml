name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # Matches the postgres service above. jest-e2e-global-setup.js falls
      # back to this same value when unset, but the e2e suite depends on
      # this specific service's credentials, so state it explicitly rather
      # than relying on the fallback coinciding with it.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_dev

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint:check

      - run: pnpm run typecheck

      - run: pnpm run test

      - run: pnpm run test:e2e

      - run: pnpm run build
