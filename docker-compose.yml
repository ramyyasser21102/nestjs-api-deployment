services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: app-backend

    ports:
      - '3000:3000'

    environment:
      NODE_ENV: development
      DATABASE_URL: 'postgresql://postgres:postgres@postgres:5432/app_dev'
      CHOKIDAR_USEPOLLING: 'true'

    volumes:
      - .:/app
      - node_modules:/app/node_modules

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: app-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_dev

    ports:
      # Host port 5433, not 5432 — this machine may already have another
      # Postgres bound to 5432. Container-to-container traffic (the
      # backend service talking to `postgres:5432`) is unaffected.
      - '5433:5432'

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  node_modules:
  postgres-data:
